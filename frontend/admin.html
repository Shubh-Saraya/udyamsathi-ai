<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UdyamSathi Data Admin</title><link rel="stylesheet" href="frontend/style.css"></head><body><main><section class="card"><p class="eyebrow">LOCAL PROTOTYPE ADMIN</p><h1>Verified external data</h1><p>Use only official sources. Records without a source URL and last-verified date must remain UNVERIFIED and are not recommended to entrepreneurs.</p><label>Data type<select id="kind"><option value="schemes">Government schemes</option><option value="financing">Financing products</option></select></label><label>Import CSV or JSON<input id="file" type="file" accept=".json,.csv,application/json,text/csv"></label><textarea id="records" rows="12" style="width:100%;font:13px monospace;padding:12px" placeholder='Paste JSON array, or choose a CSV/JSON file.'></textarea><button class="primary" onclick="save()">Import records</button><p id="result"></p></section><section class="card"><h2>Stored records</h2><div id="list">Loading...</div></section></main><script>const csv=t=>{let [h,...rows]=t.trim().split(/\r?\n/),heads=h.split(',').map(x=>x.trim());return rows.filter(Boolean).map(r=>Object.fromEntries(r.split(',').map((x,i)=>[heads[i],x.trim()])))};file.onchange=async e=>{let f=e.target.files[0],t=await f.text();records.value=f.name.endsWith('.csv')?JSON.stringify(csv(t),null,2):t};async function load(){let k=kind.value,a=await fetch('/api/'+(k==='schemes'?'schemes':'financing')+'/verified').then(r=>r.json());list.innerHTML=a.length?a.map(x=>'<p><b>'+(x.name||x.product_name)+'</b> - '+x.status+' - source: '+(x.source_name||x.source)+'</p>').join(''):'No imported records.'}kind.onchange=load;async function save(){try{let payload=JSON.parse(records.value),url=kind.value==='schemes'?'/api/admin/schemes':'/api/admin/financing',x=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({records:payload})}).then(r=>r.json());if(x.error)throw Error(x.error);result.textContent='Imported '+x.imported.length+' records.';load()}catch(e){result.textContent='Import failed: '+e.message}}load()</script></body></html>
