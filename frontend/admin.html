<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VyaparGuide AI Data Admin</title><link rel="stylesheet" href="frontend/style.css"></head>
<body><main><section class="card"><p class="eyebrow">LOCAL PROTOTYPE ADMIN</p><h1>Verified external data</h1><p>Use only official sources. Records without a source URL and last-verified date remain unverified and are not recommended to entrepreneurs.</p><label>Data type<select id="kind"><option value="schemes">Government schemes</option><option value="financing">Financing products</option></select></label><label>Import CSV or JSON<input id="file" type="file" accept=".json,.csv,application/json,text/csv"></label><textarea id="records" rows="12" style="width:100%;font:13px monospace;padding:12px" placeholder="Paste a JSON array, or choose a CSV or JSON file."></textarea><button class="primary" onclick="save()">Import records</button><p id="result"></p></section><section class="card"><h2>Stored records</h2><div id="list">Loading...</div></section></main>
<script>
const csv=t=>{const [h,...rows]=t.trim().split(/\r?\n/),heads=h.split(',').map(x=>x.trim());return rows.filter(Boolean).map(r=>Object.fromEntries(r.split(',').map((x,i)=>[heads[i],x.trim()])))};
file.onchange=async event=>{const selected=event.target.files[0],text=await selected.text();records.value=selected.name.endsWith('.csv')?JSON.stringify(csv(text),null,2):text};
async function load(){const type=kind.value,data=await fetch('/api/'+(type==='schemes'?'schemes':'financing')+'/verified').then(r=>r.json());list.innerHTML=data.length?data.map(item=>'<p><b>'+(item.name||item.product_name)+'</b> - '+item.status+' - source: '+(item.source_name||item.source)+'</p>').join(''):'No imported records.'}
kind.onchange=load;
async function save(){try{const payload=JSON.parse(records.value),url=kind.value==='schemes'?'/api/admin/schemes':'/api/admin/financing',response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({records:payload})}).then(r=>r.json());if(response.error)throw Error(response.error);result.textContent='Imported '+response.imported.length+' records.';load()}catch(error){result.textContent='Import failed: '+error.message}}
load();
</script></body></html>
